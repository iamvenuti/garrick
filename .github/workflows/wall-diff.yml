name: Wall diff

# A change to how the wall check reads a reference is released only when no row of the
# case files and end-to-end rows changes its zone verdict against the newest release,
# other than by design: refused to passed inside one zone, or a name hit with no link,
# embed, path or copy. A row that goes from passed to refused, or any other change, fails
# the job. The counts go in the job summary. tests/wall_diff.py has the rest.
on:
  pull_request:
    paths:
      - template/System/tools/check.py
      - template/System/tools/garrick_lib.py
      - tests/wall_diff.py
      - tests/test_wall_forms.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wall-diff-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  diff:
    name: Zone verdicts against the last release
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Fetch the tags
        run: git fetch --tags --force
      - name: Compare with the newest tag
        run: |
          tag=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          if [ -z "$tag" ]; then echo "No release tag to compare with."; exit 1; fi
          echo "Newest release tag: $tag"
          set +e
          /usr/bin/python3 tests/wall_diff.py "$tag" | tee wall-diff.txt
          status=${PIPESTATUS[0]}
          {
            echo "### Wall check against $tag"
            echo
            echo '```'
            cat wall-diff.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
