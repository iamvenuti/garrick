name: Something broke
description: The installer, a skill, scaffold.py or check.py did the wrong thing.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please use invented names (Acme, Birch) in everything you paste. Never paste a real client's names, notes or transcripts into an issue.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got instead. Paste the exact error.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to make it happen again
      description: Ideally starting from the demo workspace (python3 examples/demo/build.py --target ~/Garrick-demo).
    validations:
      required: true
  - type: dropdown
    id: assistant
    attributes:
      label: Assistant
      options: [Claude Code, Codex, Both, Not relevant]
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Output of `python3 --version`, `git --version`, and `claude --version` or `codex --version`. If you use the Claude or ChatGPT desktop app instead, give the version its About window shows (in the app menu, choose About).
    validations:
      required: true
  - type: input
    id: garrick
    attributes:
      label: Which Garrick
      description: The output of `python3 System/tools/check.py --version`, run in your workspace. It says which Garrick the workspace was installed from, which tells whether the bug is already fixed. If it says the version is unknown, give the day you downloaded the ZIP, or for a clone the output of `git -C ~/garrick-source log -1 --format=%h`.
