name: The wall check refused something it should allow
description: A false positive from check.py or the pre-commit hook.
labels: [wall-check, false-positive]
body:
  - type: markdown
    attributes:
      value: |
        This form is for refusals that were wrong. If the check let something through that it should have stopped, do not open an issue: report it privately (see SECURITY.md).

        Rebuild the case with invented names before you paste anything.
  - type: input
    id: zones
    attributes:
      label: The two zones
      description: The zone of the file the check refused, and the zone of the file it pointed at, as walled or open, with invented names. For example, Maple (walled) and Harbour (walled).
    validations:
      required: true
  - type: textarea
    id: reference
    attributes:
      label: The reference
      description: The link, embed, path or copied file the check read as a crossing, and the finding check.py printed, with invented names.
    validations:
      required: true
  - type: textarea
    id: why-fine
    attributes:
      label: Why it should pass
      description: For example, the file is published material, or the path is text that only looks like a path.
    validations:
      required: true
