<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Garrick social preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baskervville:wght@400..700&family=DM+Sans:wght@400..700&display=swap">
<style>
  html,body{margin:0;width:1280px;height:640px;background:#1E2833;overflow:hidden}
  .card{box-sizing:border-box;width:1280px;height:640px;padding:72px 88px;display:flex;flex-direction:column;justify-content:center;gap:26px;font-family:'DM Sans',Arial,sans-serif;color:#F5F0E6}
  .eyebrow{font-size:20px;font-weight:600;letter-spacing:4px;text-transform:uppercase;color:#8EB1F5;margin:0}
  h1{font-family:'Baskervville','Libre Baskerville',Baskerville,Georgia,serif;font-weight:500;font-size:112px;line-height:1;margin:0}
  .tag{font-size:34px;line-height:1.3;color:#C9CFD6;margin:0;max-width:1000px}
  .pills{display:flex;gap:14px;margin-top:10px;flex-wrap:wrap}
  .pills span{font-size:21px;padding:10px 20px;border-radius:999px;background:#2A3643;color:#F5F0E6}
  .pills span b{color:#8EB1F5;font-weight:600}
  .lockup{display:flex;align-items:center;gap:32px}
  .lockup svg{width:112px;height:112px;flex:none}
</style></head>
<body><div class="card">
  <p class="eyebrow">An AI chief of staff for knowledge work</p>
  <div class="lockup"><svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path fill="#F5F0E6" d="M22.75 6V58H8.5C7.12 58 6 56.88 6 55.5V8.5C6 7.12 7.12 6 8.5 6ZM26.75 32H58V55.5C58 56.88 56.88 58 55.5 58H26.75Z"/><path fill="#8EB1F5" d="M26.75 6H55.5C56.88 6 58 7.12 58 8.5V28H26.75Z"/></svg><h1>Garrick</h1></div>
  <p class="tag">Remembers your work and knows whose confidences you hold.</p>
  <div class="pills"><span><b>Boundaries</b> you declare</span><span><b>Claude</b> or Codex</span><span><b>Built</b> to be spoken to</span><span><b>Files</b> you own</span></div>
</div></body></html>
