name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A push to a pull request cancels the run it supersedes. Runs on main are never
# cancelled: each one is the record of what main held.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: macOS, Python ${{ matrix.python }}, shard ${{ matrix.shard }}
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # "system" is /usr/bin/python3 from the Command Line Tools: 3.9, what most users have.
        python: ["system", "3.13"]
        # tests/shard.py deals the test modules into four shards by their times in
        # tests/shard-times.json. Change the count here and in the run step together.
        # GitHub runs at most five macOS jobs at once, so each shard also runs three
        # modules at a time (--jobs 3), one per core of the runner.
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        if: matrix.python != 'system'
        with:
          python-version: ${{ matrix.python }}
      - name: Pick the interpreter
        run: |
          if [ "${{ matrix.python }}" = system ]; then py=/usr/bin/python3; else py=python; fi
          echo "PY=$py" >> "$GITHUB_ENV"
          "$py" --version
      - name: Install Claude Code, for the mod's checks
        # The version extras/mods/README.md names as tested.
        run: npm install -g @anthropic-ai/claude-code@2.1.295
      - name: Type-check the Mac app
        # As make-app.sh compiles them: the app is Garrick.swift as main.swift plus GarrickShared.swift,
        # the Finder extension is GarrickFinder.swift plus GarrickShared.swift as a library. The SDK's own
        # frameworks, no other flags. Once per run, since neither the Python nor the shard changes it;
        # skipped with no Swift compiler.
        if: matrix.python == 'system' && matrix.shard == 1
        run: |
          if xcrun --find swiftc >/dev/null 2>&1; then
            T=$(mktemp -d)
            cp extras/status/app/Garrick.swift "$T/main.swift"
            xcrun swiftc -typecheck -warnings-as-errors "$T/main.swift" extras/status/app/GarrickShared.swift
            xcrun swiftc -typecheck -warnings-as-errors -application-extension -parse-as-library -module-name GarrickFinder \
              extras/status/app/GarrickFinder.swift extras/status/app/GarrickShared.swift
          else
            echo "No Swift compiler on this runner: Garrick.swift is not type-checked."
          fi
      - name: Run the shard
        env:
          # Comma-separated real names that must never appear. Empty on forks: the test skips.
          GARRICK_CLEANROOM_NAMES: ${{ secrets.GARRICK_CLEANROOM_NAMES }}
        run: $PY tests/shard.py ${{ matrix.shard }}/4 --jobs 3

  tests:
    # The one result to wait for, and the one for branch protection to name: it fails if any shard did.
    name: Tests
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed
        run: |
          if [ "${{ needs.test.result }}" != success ]; then
            echo "A shard did not pass: ${{ needs.test.result }}."
            exit 1
          fi
          echo "Every shard passed."
